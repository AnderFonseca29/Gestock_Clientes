<div class="register-container">
  <div class="register-card">
    <h2>Creación de Usuarios</h2>
    <p class="subtitle">Registra una nueva cuenta para acceder al sistema</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="nombreCompleto">Nombre Completo</label>
        <input 
          type="text" 
          id="nombreCompleto" 
          formControlName="nombreCompleto" 
          placeholder="Ej. Juan Pérez"
          [class.invalid]="registerForm.get('nombreCompleto')?.touched && registerForm.get('nombreCompleto')?.invalid"
        />
        <span class="error-msg" *ngIf="registerForm.get('nombreCompleto')?.touched && registerForm.get('nombreCompleto')?.errors?.['required']">
          El nombre es obligatorio.
        </span>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="usuario@ejemplo.com"
          [class.invalid]="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
        />
        <span class="error-msg" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors?.['email']">
          Ingresa un correo válido.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          placeholder="Mínimo 6 caracteres"
          [class.invalid]="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
        />
        <span class="error-msg" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['minlength']">
          Debe tener al menos 6 caracteres.
        </span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input 
          type="password" 
          id="confirmPassword" 
          formControlName="confirmPassword" 
          placeholder="Repite tu contraseña"
          [class.invalid]="registerForm.get('confirmPassword')?.touched && registerForm.errors?.['mismatch']"
        />
        <span class="error-msg" *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.errors?.['mismatch']">
          Las contraseñas no coinciden.
        </span>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Registrando...' : 'Crear Usuario' }}
      </button>

      <div class="actions">
        <a routerLink="/login">¿Ya tienes cuenta? Inicia Sesión</a>
      </div>

    </form>
  </div>
</div>
