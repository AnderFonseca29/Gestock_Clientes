<div class="login-container">

    <div class="login-card">

        <div class="logo-section">

            <div class="logo-icon">
                G
            </div>

            <h1>Gestock</h1>

            <p>Sistema de gestión de inventario</p>

        </div>


        <div class="login-form">

            <!-- CORREO -->
            <div class="form-group">

                <label for="email">
                    Correo Electrónico
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    [(ngModel)]="email"
                    placeholder="Ingrese su correo"
                    autocomplete="email"
                >

            </div>


            <!-- CONTRASEÑA -->
            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    [(ngModel)]="password"
                    placeholder="Ingrese su contraseña"
                    autocomplete="current-password"
                >

            </div>


            <!-- INGRESAR -->
            <button
                type="button"
                class="login-button"
                (click)="login()">

                Ingresar

            </button>


            <!-- CREAR USUARIO -->
            <button
                type="button"
                class="register-button"
                (click)="goToRegister()">

                Crear Usuario

            </button>

        </div>


        <div class="login-footer">

            <span>© 2026 Gestock</span>

            <span>Sistema ADSO</span>

        </div>

    </div>

</div>
