<aside class="sidebar">

  <!-- LOGO -->
  <div class="sidebar-header">

    <div class="logo-icon">
      G
    </div>

    <div class="logo-info">
      <h2>Gestock</h2>
      <span>Gestión de inventario</span>
    </div>

  </div>


  <!-- MENÚ -->
  <nav class="sidebar-menu">

    <p class="menu-title">
      MENÚ PRINCIPAL
    </p>

    <a
      *ngFor="let item of menu"
      class="menu-item"
      [routerLink]="item.ruta"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >

      <span class="menu-icon">
        {{ item.icono }}
      </span>

      <span class="menu-text">
        {{ item.nombre }}
      </span>

      <span class="menu-arrow">
        ›
      </span>

    </a>

  </nav>


  <!-- PARTE INFERIOR -->
  <div class="sidebar-bottom">

    <div class="user-mini">

      <div class="user-avatar">
        A
      </div>

      <div class="user-info">

        <strong>
          {{ nombreUsuario }}
        </strong>

        <span>
          {{ rolUsuario }}
        </span>

      </div>

    </div>


    <button
      type="button"
      class="logout-button"
      (click)="cerrarSesion()"
    >

      <span>↪</span>

      <span>
        Cerrar sesión
      </span>

    </button>

  </div>

</aside>
