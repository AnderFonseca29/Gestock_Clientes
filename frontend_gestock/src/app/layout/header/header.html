<header class="header-container">
  <!-- Lado Izquierdo: Título de la Sección -->
  <div class="header-title">
    <h1>{{ title }}</h1>
  </div>

  <!-- Lado Derecho: Acciones y Usuario -->
  <div class="header-actions">
    
    <!-- Botón Notificaciones con Badge -->
    <button mat-icon-button class="icon-btn" aria-label="Notificaciones">
      <mat-icon 
        [matBadge]="notificationCount" 
        matBadgeColor="warn" 
        matBadgeSize="small">
        notifications
      </mat-icon>
    </button>

    <!-- Perfil del Usuario -->
    <div class="user-profile">
      <div class="avatar">
        {{ userInitial }}
      </div>
      <div class="user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">{{ userRole }}</span>
      </div>
      <mat-icon class="dropdown-icon">expand_more</mat-icon>
    </div>

  </div>
</header>
