<div class="empresas-container">
  
  <div class="header-section">
    <h1 class="page-title">Empresas</h1>
    <p class="page-subtitle">Personaliza tu experiencia en GESTOCK</p>
  </div>

  <div class="config-card">
    <h2 class="card-title">Configuración</h2>
    <p class="card-subtitle">Personaliza la información de tu empresa</p>

    <!-- ALERTAS DE FEEDBACK -->
    @if (mensajeExito) {
      <div class="alert alert-success">{{ mensajeExito }}</div>
    }
    @if (mensajeError) {
      <div class="alert alert-danger">{{ mensajeError }}</div>
    }

    <form class="config-form" (ngSubmit)="guardarCambios()">
      
      <!-- CAMPO NOMBRE -->
      <div class="form-group full-width">
        <label for="nombreEmpresa">Nombre de la Empresa *</label>
        <input 
          id="nombreEmpresa"
          type="text" 
          class="custom-input" 
          [(ngModel)]="empresa.nombre" 
          name="nombre"
          placeholder="GESTOCK Inc.">
      </div>

      <!-- CAMPO EMAIL -->
      <div class="form-group full-width">
        <label for="emailContacto">Email de contacto *</label>
        <input 
          id="emailContacto"
          type="email" 
          class="custom-input" 
          [(ngModel)]="empresa.email" 
          name="email"
          placeholder="contacto@gestock.com">
      </div>

      <!-- FILA DE SELECTS -->
      <div class="form-row">
        
        <div class="form-group">
          <label for="moneda">Moneda</label>
          <div class="select-wrapper">
            <select 
              id="moneda"
              class="custom-input custom-select" 
              [(ngModel)]="empresa.moneda" 
              name="moneda">
              <option value="COP">COP - Peso Colombiano</option>
              <option value="USD">USD - Dólar</option>
            </select>
            <span class="select-arrow">▼</span>
          </div>
        </div>

        <div class="form-group">
          <label for="formatoFecha">Formato de Fecha</label>
          <div class="select-wrapper">
            <select 
              id="formatoFecha"
              class="custom-input custom-select" 
              [(ngModel)]="empresa.formatoFecha" 
              name="formatoFecha">
              <option value="DD/MM/YYYY">DD/MM/YYYY</option>
              <option value="YYYY-MM-DD">YYYY-MM-DD</option>
            </select>
            <span class="select-arrow">▼</span>
          </div>
        </div>

      </div>

      <!-- BOTONES DE ACCIÓN (CANCELAR Y GUARDAR) -->
      <div class="actions-footer">
        <button type="button" class="btn-cancel" (click)="cancelar()">
          Cancelar
        </button>
        <button type="submit" class="btn-save" [disabled]="guardando">
          {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
        </button>
      </div>

    </form>
  </div>

</div>
