<div class="login-container">
  <div class="login-card">
    
    <!-- Sección Izquierda: Branding -->
    <div class="brand-section">
      <div class="brand-content-centered">
        <div class="brand-logo-glow">
          <span class="icon">📦</span>
          <h2>Gestock</h2>
        </div>
        <p class="brand-tagline">Gestión Inteligente de Inventarios y Productos.</p>
      </div>
      
      <div class="brand-footer">
        <small>Sistema ADSO &copy; 2026</small>
      </div>
    </div>

    <!-- Sección Derecha: Formulario -->
    <div class="form-section">
      <div class="form-header">
        <h2>Bienvenido de nuevo</h2>
        <p>Inicia sesión con tu cuenta para acceder al panel</p>
      </div>

      <form class="login-form" (ngSubmit)="login()">
        
        <!-- Campo Correo -->
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input 
              id="email" 
              type="email" 
              [(ngModel)]="email" 
              name="email"
              placeholder="nombre@empresa.com"
              required>
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input 
              id="password" 
              type="password" 
              [(ngModel)]="password" 
              name="password"
              placeholder="••••••••"
              required>
          </div>
        </div>

        <!-- Botones de Acción -->
        <div class="actions-group">
          <button type="submit" class="btn-primary">
            <span>Ingresar</span>
            <span class="arrow">→</span>
          </button>

          <div class="or-divider">
            <span>o</span>
          </div>

          <button type="button" class="btn-google" (click)="loginConGoogle()">
            <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Continuar con Google</span>
          </button>
        </div>

      </form>

      <div class="divider">
        <span>¿No tienes una cuenta?</span>
      </div>

      <button type="button" class="btn-secondary" (click)="goToRegister()">
        Registrarme
      </button>
    </div>

  </div>
</div>
