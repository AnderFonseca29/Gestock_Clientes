<div class="inventario-container">
  <header class="inventario-header">
    <div class="header-title">
      <h1>Gestión de Inventario</h1>
      <p>Administra existencias, bodegas, registro de productos y alertas en un solo lugar.</p>
    </div>
  </header>

  <nav class="inventario-tabs">
    <button 
      [class.active]="tabActiva() === 'stock'" 
      (click)="setTab('stock')">
      📊 Existencias
    </button>
    <button 
      [class.active]="tabActiva() === 'bodegas'" 
      (click)="setTab('bodegas')">
      🏢 Bodegas
    </button>
    <button 
      [class.active]="tabActiva() === 'registrar'" 
      (click)="setTab('registrar')">
      ➕ Registrar Producto
    </button>
    <button 
      [class.active]="tabActiva() === 'alertas'" 
      (click)="setTab('alertas')">
      🚨 Alertas y Control
    </button>
  </nav>

  <main class="inventario-content">
    @switch (tabActiva()) {
      @case ('stock') {
        <app-lista-productos></app-lista-productos>
      }
      @case ('bodegas') {
        <app-bodegas></app-bodegas>
      }
      @case ('registrar') {
        <app-registrar-productos></app-registrar-productos>
      }
      @case ('alertas') {
        <app-alertas-control></app-alertas-control>
      }
    }
  </main>
</div>
